name: Contract tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * *'
  repository_dispatch:
    types: [openapi-updated]

permissions:
  contents: read
  issues: write

jobs:
  contract:
    name: validate parser against latest audd-openapi fixtures
    runs-on: ubuntu-latest
    # The official Swift image carries the toolchain's own system libraries, so
    # the job doesn't depend on what the runner image happens to ship.
    container: swift:5.10
    steps:
      - uses: actions/checkout@v4
        with:
          path: audd-swift
      - uses: actions/checkout@v4
        with:
          repository: AudDMusic/audd-openapi
          path: audd-openapi
          ref: main
      - name: Run contract tests
        working-directory: audd-swift
        # GITHUB_WORKSPACE is the path inside the container; the
        # github.workspace expression is the path on the host.
        run: AUDD_OPENAPI_FIXTURES="$GITHUB_WORKSPACE/audd-openapi/fixtures" swift test --filter 'Contract'
      - name: Report drift issue
        if: failure() && github.event_name != 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'contract-drift'
            });
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            if (open.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: open[0].number,
                body: `Still failing against the latest audd-openapi spec.\n\nRun: ${runUrl}`
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: `contract drift detected (${context.workflow})`,
                body: `Contract tests failed against the latest audd-openapi spec.\n\nRun: ${runUrl}`,
                labels: ['contract-drift']
              });
            }
      - name: Close drift issue on recovery
        if: success() && github.event_name != 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'contract-drift'
            });
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            for (const issue of open) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number,
                body: `Contract tests are passing again — closing.\n\nRun: ${runUrl}`
              });
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number, state: 'closed'
              });
            }
